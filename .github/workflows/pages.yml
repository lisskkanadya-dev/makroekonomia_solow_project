name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest
      - name: Generate report
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.solow_app --output-dir site
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Prefer a personal access token stored in the secret GH_PAGES_DEPLOY_TOKEN
          # Create a PAT with 'repo' scope and add it to the repository secrets.
          github_token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
          publish_dir: site
